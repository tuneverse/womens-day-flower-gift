name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_BASE_PATH: /womens-day-flower-gift

      - name: Prepare Pages-compatible asset paths
        run: |
          mv dist/client/_next dist/client/next-assets
          python3 - <<'PY'
          from pathlib import Path

          root = Path("dist/client")
          text_suffixes = {".html", ".js", ".css", ".json", ".rsc", ".txt"}
          for path in root.rglob("*"):
              if path.is_file() and path.suffix in text_suffixes:
                  text = path.read_text(encoding="utf-8")
                  path.write_text(text.replace("/_next/", "/next-assets/"), encoding="utf-8")

          html = (root / "20-10.html").read_text(encoding="utf-8")
          if "/_next/" in html or "next-assets/static/css/" not in html:
              raise SystemExit("GitHub Pages asset paths were not rewritten")
          PY

      - name: Prepare GitHub Pages routes
        run: |
          test -f dist/client/index.html
          test -f dist/client/20-10.html
          mkdir -p dist/client/20-10
          cp dist/client/20-10.html dist/client/20-10/index.html

      - name: Add Pages marker
        run: touch dist/client/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
